# Reloj externo: cada 5 minutos le pide al servidor de Tasita que revise con
# Mercado Pago quién pagó, quién renovó y quién se dio de baja.
# Es uno de varios disparadores (también revisa cuando alguien abre la app o el
# panel), así que si GitHub se atrasa unos minutos no pasa nada.
name: Revisar Mercado Pago

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Pedir revisión
        run: curl -fsS --max-time 30 https://tasita-api.rodrigogalarzaok.workers.dev/revisar
