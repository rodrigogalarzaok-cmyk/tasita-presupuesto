# Respaldo del reloj. El reloj principal es el Worker 'tasita-reloj' (carpeta
# reloj/), que cada minuto le pide al servidor que revise con Mercado Pago.
# Esto, cada tanto (GitHub no es puntual), vuelve a poner en marcha ese reloj
# por si se hubiera detenido, y pide una revisión.
name: Revisar Mercado Pago

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Asegurar el reloj y pedir revisión
        run: |
          curl -fsS --max-time 30 https://tasita-reloj.rodrigogalarzaok.workers.dev/
          curl -fsS --max-time 30 https://tasita-api.rodrigogalarzaok.workers.dev/revisar
